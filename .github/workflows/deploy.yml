name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # All optional. Primary real-time path — browser signs in with
          # Microsoft and reads Graph directly (see SETUP.md, "Real-time
          # sync"). None of these are secrets: client/tenant IDs and the
          # share link are public identifiers, safe in the client bundle.
          VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_SHAREPOINT_SHARE_URL: ${{ vars.SHAREPOINT_SHARE_URL }}
          # Secondary/optional real-time path — only set once
          # azure-function/ is deployed (see its README). Blank is fine:
          # the dashboard falls back to bundled data.json (~30-min
          # freshness) if neither this nor the above are configured.
          VITE_REALTIME_DATA_URL: ${{ vars.REALTIME_DATA_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
