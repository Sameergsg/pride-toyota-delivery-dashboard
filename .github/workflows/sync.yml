name: Sync Data

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # needed to dispatch deploy.yml — see the note in "Trigger deploy" below

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        id: sync
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SHAREPOINT_SHARE_URL: ${{ secrets.SHAREPOINT_SHARE_URL }}
          CI: true
        run: |
          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$SHAREPOINT_SHARE_URL" ] || { [ -z "$AZURE_REFRESH_TOKEN" ] && [ -z "$AZURE_CLIENT_SECRET" ]; }; then
            echo "::warning::Azure AD secrets not configured yet — skipping live sync. See SETUP.md."
            exit 0
          fi
          node scripts/sync.mjs

      # GitHub deliberately does NOT let a push made with the default
      # GITHUB_TOKEN trigger other workflows (infinite-loop protection),
      # so the data commit above would silently never redeploy the site.
      # Explicitly dispatch deploy.yml instead, only when data changed.
      - name: Trigger deploy
        if: steps.sync.outputs.data_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
