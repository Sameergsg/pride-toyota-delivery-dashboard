<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Private vehicle delivery & inventory tracking dashboard for Pride Toyota (Goyal Sons Automobiles)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pride Toyota — Delivery Dashboard</title>
    <script>
      // Applies the saved theme before first paint, so there's no flash
      // of the default dark theme before React mounts (see src/lib/theme.ts
      // for the actual theme list — kept in sync with the ids below only
      // in the sense that an unrecognized/missing value harmlessly no-ops).
      (function () {
        try {
          var saved = localStorage.getItem('ptd-dashboard-theme');
          if (saved && saved !== 'toyota-red') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
